[project]
name = "thunc"
version = "0.2.3"
description = "think + function: call an LLM like a typed Python function."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hussein Eltarras" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["llm", "ai", "claude", "typed", "openai", "structured-output", "prompt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
thunc = "thunc.__main__:main"

[project.urls]
Homepage = "https://eltarras.github.io/thunc/"
Documentation = "https://eltarras.github.io/thunc/docs/"
Repository = "https://github.com/Eltarras/thunc"
Issues = "https://github.com/Eltarras/thunc/issues"

[project.optional-dependencies]
anthropic = ["anthropic"]   # only for the Claude API backend
openai = ["openai"]         # only for the OpenAI API backend
temporal = ["temporalio>=1.34,<2"]
temporal-test = ["temporalio==1.34.0", "pytest-asyncio>=0.24"]
watch = ["thunc-watch>=0.1,<0.2"]  # the `thunc watch` dashboard, a compiled binary (watch/)
dev = ["pytest", "mypy", "ruff", "basedpyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thunc"]

[tool.hatch.build.targets.sdist]
exclude = ["/watch"]  # published on its own, as thunc-watch

[tool.pytest.ini_options]
testpaths = ["tests"]       # offline only; run `pytest live_tests` to call a real model
pythonpath = ["."]
markers = ["temporal_integration: runs the official local Temporal service without providers"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
"thunc/prompts.py" = ["E501"]  # prompt text: one bullet per line, as the model reads it

[tool.mypy]
# AI functions have empty bodies (docstring + `...`) by design: the model is the implementation.
disable_error_code = ["empty-body"]
