name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[anthropic,openai,dev]"
      - run: pytest            # offline tests only; live_tests need a model and are not run in CI
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict thunc
