name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[anthropic,openai,temporal-test,dev]"
      - run: pytest            # offline tests only; live_tests need a model and are not run in CI
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict thunc
      - run: mypy --strict --platform win32 thunc

  # The lock, process stopping and path handling have code just for Windows.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[anthropic,openai,dev]"
      - run: pytest
        env:
          PYTHONIOENCODING: utf-8  # the console's own code page can't print every test id and message

  # thunc-watch, the terminal dashboard: a Rust crate in watch/, separate from the Python package.
  watch:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: The PyPI wheel builds and runs
        if: matrix.os == 'ubuntu-latest'
        run: |
          pipx run maturin build --release --locked --out dist
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl ..
          /tmp/wheel-check/bin/thunc watch --version

  temporal-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[anthropic,openai,temporal-test,dev]"
      - name: Real service, restart and replay tests (no providers)
        run: pytest -c pytest-temporal.ini tests/temporal -q
        env:
          THUNC_TEMPORAL_TESTS: "1"
